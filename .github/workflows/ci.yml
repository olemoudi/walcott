name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/badges/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Aggregated coverage report
        run: ./gradlew jacocoAggregatedReport

      - name: Generate coverage badge
        run: python3 scripts/coverage_badge.py

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # Compiles the on-device tests without running them (no emulator here). They are the only
      # checks that the operating system really suspends what the rules ask, and they had gone
      # stale unnoticed for two releases because `gradlew test` never touches this source set.
      - name: Compile the on-device tests
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet .github/badges/coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.svg
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
